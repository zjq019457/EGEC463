# Default configuration for brain tumor detection

model:
  size: "small"  # Options: nano, small, medium, large, xlarge
  save_dir: "runs/train"
  weights_dir: "weights"

data:
  yaml_url: "https://raw.githubusercontent.com/ultralytics/ultralytics/main/ultralytics/cfg/datasets/brain-tumor.yaml"
  local_path: "brain-tumor.yaml"
  validation_images_dir: "datasets/brain-tumor/images/val"
  validation_labels_dir: "datasets/brain-tumor/labels/val"

training:
  epochs: 50
  batch_size: 16
  image_size: 320
  device: "auto" # Options: auto, cpu, cuda, mps
  workers: 0

augmentation:
  scale: 0.9
  mosaic: 0.9
  mixup: 0.2
  copy_paste: 0.4
  rotation: 10
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
